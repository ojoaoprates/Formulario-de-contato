<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/contato.css">
    <title>Document</title>
    <script src="validacao.js"></script>
</head>
<body>
   <form id="meuForm">
    <h1 bold>Formulário de contato</h1>
        <label for="campoNome">Nome:</label>
        <input type="text" id="campoNome" placeholder="Digite o nome" required><br>
    
        <label for="Email">E-mail:</label>
        <input type="Email" id="SeuEmail" placeholder="Digite seu e-mail" required><br>
    
        <label for="Assunto" class="Assunto">Assunto:</label>
        <input type="Assunto" id="Assunto" placeholder="Assunto" required><br>

        <label class="mensagem" for="Mensagem">Mensagem</label>
        <textarea id="mensagem"  required ></textarea>

        <div class="controles">
            <button type="submit">Enviar</button>
        </div>
    </form>
    <div id="resultado"></div>
</body>
</html>
